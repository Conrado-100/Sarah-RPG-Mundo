<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forja de Idiomas - RPG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .card {
            max-width: 450px;
            width: 100%;
            background: #111827;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid #1e293b;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 12px;
            color: #f3f4f6;
        }

        p {
            font-size: 1rem;
            color: #9ca3af;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .btn-gerador {
            display: inline-block;
            width: 100%;
            padding: 16px 24px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6d28d9 0%, #1e1b4b 100%);
            border: 1px solid #7c3aed;
            box-shadow: 0 4px 15px rgba(109, 40, 217, 0.4);
            transition: all 0.3s ease;
        }

        .btn-gerador:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(124, 58, 237, 0.6);
            background: linear-gradient(135deg, #7c3aed 0%, #0f172a 100%);
        }

        .btn-gerador:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎲 Forja de Idiomas</h1>
        <p>Gerador procedural de nomes e línguas fictícias para campanhas de RPG de mesa.</p>
        <a href="https://conrado-100.github.io/Sarah-RPG-Mundo/logica/index.html" class="btn-gerador">
            Entrar no Gerador
        </a>
    </div>
</body>
</html>
