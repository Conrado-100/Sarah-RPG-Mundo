<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Mapas RPG 2D - 16-Bit Retro</title>
    
    <!-- Bibliotecas Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
        
        .palette-btn {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #cbd5e1;
            font-size: 0.72rem;
            padding: 0.4rem 0.5rem;
            border-radius: 0.5rem;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            width: 100%;
        }
        .palette-btn:hover { background-color: #1e293b; border-color: #64748b; color: #f8fafc; }
        .palette-btn.active {
            background-color: #064e3b;
            border-color: #10b981;
            color: #34d399;
            font-weight: 600;
        }

        .nav-btn {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #38bdf8;
            font-weight: bold;
            font-size: 0.75rem;
            border-radius: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .nav-btn:hover { background-color: #1e293b; border-color: #38bdf8; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none p-4">

    <!-- Cabeçalho Principal -->
    <header class="w-full max-w-7xl mx-auto bg-slate-900 border border-slate-800 rounded-xl p-3 mb-4 shadow-lg flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <a href="../index.html" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs border border-slate-700 transition" title="Voltar ao Menu Principal">
                <i class="fa-solid fa-house"></i> Menu
            </a>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-base font-black text-slate-100 tracking-wide">Criador de Mapas RPG 2D</h1>
                    <span class="text-[10px] bg-emerald-500/20 text-emerald-400 font-mono font-bold px-2 py-0.5 rounded border border-emerald-500/30">16-Bit Expanded</span>
                </div>
                <p class="text-[11px] text-slate-400">Edição Ortopédica 2D - Grade 12x12 com Setores Infinitos</p>
            </div>
        </div>

        <!-- Botões do Header -->
        <div class="flex items-center gap-2 text-xs">
            <button id="btnSoundToggle" class="px-3 py-1.5 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-lg hover:bg-amber-500/20 font-medium transition flex items-center gap-1.5">
                <i class="fa-solid fa-volume-high"></i> Som: <span id="soundLabel">LIGADO</span>
            </button>
            
            <button id="btnSaveProject" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium shadow transition flex items-center gap-1.5">
                <i class="fa-solid fa-download"></i> Salvar
            </button>

            <button id="btnLoadProject" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium shadow transition flex items-center gap-1.5">
                <i class="fa-solid fa-upload"></i> Carregar
            </button>
            <input type="file" id="fileLoadProject" accept=".json" class="hidden">

            <button id="btnImportJSON" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white rounded-lg font-medium shadow transition flex items-center gap-1.5">
                <i class="fa-solid fa-file-import"></i> Importar JSON
            </button>
            <input type="file" id="jsonInput" accept=".json" class="hidden">

            <button id="btnExportPNG" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-medium shadow transition flex items-center gap-1.5">
                <i class="fa-solid fa-image"></i> Exportar PNG

        </div>
    </header>

    <!-- Área Principal -->
    <main class="w-full max-w-7xl mx-auto flex-1 flex flex-col lg:flex-row gap-4 items-start">
        
        <!-- Sidebar Esquerda -->
        <aside class="w-full lg:w-80 flex flex-col gap-4">
            
            <!-- Paleta de Elementos -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg flex flex-col gap-3">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                    <h2 class="text-xs font-bold text-slate-100 flex items-center gap-2">
                        🎨 Paleta de Elementos
                    </h2>
                    <span id="activeElementLabel" class="text-xs font-semibold text-emerald-400">Grama</span>
                </div>

                <div class="flex flex-col gap-3 overflow-y-auto max-h-[520px] pr-1">
                    
                    <!-- Terrenos Básicos & Especiais (1x1) -->
                    <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">🌱 Terrenos Básicos & Biomas (1x1)</span>
                        <div class="grid grid-cols-2 gap-1.5">
                            <button class="palette-btn active" data-id="grama" data-type="terrain">🟢 Grama</button>
                            <button class="palette-btn" data-id="terra" data-type="terrain">🟤 Terra</button>
                            <button class="palette-btn" data-id="agua" data-type="terrain">🔵 Água Animada</button>
                            <button class="palette-btn" data-id="agua_congelada" data-type="terrain">🧊 Água Congelada</button>
                            <button class="palette-btn" data-id="neve" data-type="terrain">❄️ Neve</button>
                            <button class="palette-btn" data-id="areia_praia" data-type="terrain">🏖️ Areia Praia</button>
                            <button class="palette-btn" data-id="areia" data-type="terrain">🟡 Areia Deserto</button>
                            <button class="palette-btn" data-id="pedra" data-type="terrain">⚪ Pedra</button>
                            <button class="palette-btn" data-id="taiga" data-type="terrain">🌲 Taiga</button>
                            <button class="palette-btn" data-id="rocha" data-type="terrain">⚫ Rocha</button>
                            <button class="palette-btn" data-id="manguezal" data-type="terrain">🌾 Manguezal</button>
                            <button class="palette-btn" data-id="lama" data-type="terrain">💩 Lama</button>
                            <button class="palette-btn col-span-2 text-orange-400 border-orange-500/30" data-id="lava" data-type="terrain">🔥 Lava Animada</button>
                        </div>
                        <button class="palette-btn border-rose-500/30 text-rose-400 hover:bg-rose-500/10 mt-1.5 justify-center" data-id="clear" data-type="clear">
                            🧹 Limpar Célula
                        </button>
                    </div>

                    <!-- Vegetação & Natureza -->
                    <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">🌲 Vegetação & Flora</span>
                        <div class="grid grid-cols-2 gap-1.5">
                            <button class="palette-btn" data-id="arvore" data-type="object" data-w="1" data-h="2">🌲 Árvore (1x2)</button>
                            <button class="palette-btn" data-id="pinheiro" data-type="object" data-w="1" data-h="2">🌲 Pinheiro (1x2)</button>
                            <button class="palette-btn" data-id="coqueiro" data-type="object" data-w="1" data-h="2">🌴 Coqueiro (1x2)</button>
                            <button class="palette-btn" data-id="savana" data-type="object" data-w="1" data-h="2">🌾 Savana (1x2)</button>
                            <button class="palette-btn" data-id="cacto" data-type="object" data-w="1" data-h="2">🌵 Cacto (1x2)</button>
                            <!-- Arbustos por Bioma (1x1) -->
                            <button class="palette-btn" data-id="arbusto_grama" data-type="object" data-w="1" data-h="1">☘️ Arbusto Grama</button>
                            <button class="palette-btn" data-id="arbusto_neve" data-type="object" data-w="1" data-h="1">❄️ Arbusto Neve</button>
                            <button class="palette-btn" data-id="arbusto_praia" data-type="object" data-w="1" data-h="1">🌾 Arbusto Praia</button>
                            <button class="palette-btn" data-id="arbusto_mangue" data-type="object" data-w="1" data-h="1">🌿 Arbusto Mangue</button>
                        </div>
                    </div>

                    <!-- Estruturas, Construções & Embarcações -->
                    <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">🏰 Construções & Embarcações</span>
                        <div id="structuresContainer" class="grid grid-cols-2 gap-1.5">
                            <button class="palette-btn" data-id="casa" data-type="object" data-w="2" data-h="2">🏠 Casa 1A (2x2)</button>
                            <button class="palette-btn" data-id="casa_2andares" data-type="object" data-w="2" data-h="3">🏡 Casa 2A (2x3)</button>
                            <button class="palette-btn" data-id="torre" data-type="object" data-w="2" data-h="3">🏰 Torre (2x3)</button>
                            <button class="palette-btn" data-id="portao" data-type="object" data-w="2" data-h="2">🚪 Portão (2x2)</button>
                            <button class="palette-btn" data-id="muralha" data-type="object" data-w="1" data-h="1">🧱 Muralha (1x1)</button>
                            <button class="palette-btn text-rose-300 border-rose-500/30" data-id="vulcao" data-type="object" data-w="3" data-h="3">🌋 Vulcão (3x3)</button>
                            <!-- Barcos -->
                            <button class="palette-btn" data-id="barco_pequeno" data-type="object" data-w="1" data-h="2">🚣 Barco P (1x2)</button>
                            <button class="palette-btn" data-id="barco_medio" data-type="object" data-w="2" data-h="3">⛵ Barco M (2x3)</button>
                            <button class="palette-btn col-span-2" data-id="barco_grande" data-type="object" data-w="3" data-h="4">🚢 Galeão Grande (3x4)</button>
                            <button class="palette-btn col-span-2 border-amber-500/40 text-amber-300" data-id="castelo" data-type="object" data-w="4" data-h="4">
                                🏰 Castelo Real (4x4)
                            </button>
                        </div>
                    </div>

                    <!-- Unidades Militares (1x1) -->
                    <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">⚔️ Unidades Militares (1x1)</span>
                        <div class="grid grid-cols-2 gap-1.5">
                            <button class="palette-btn" data-id="arqueiro" data-type="unit">🏹 Arqueiro</button>
                            <button class="palette-btn" data-id="cavaleiro" data-type="unit">🛡️ Cavaleiro</button>
                            <button class="palette-btn" data-id="piqueiro" data-type="unit">🗡️ Piqueiro</button>
                            <button class="palette-btn" data-id="besteiro" data-type="unit">🎯 Besteiro</button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Navegação do Mundo -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg flex flex-col gap-3">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                    <h2 class="text-xs font-bold text-slate-100 flex items-center gap-1.5">🧭 Navegação do Mundo</h2>
                    <span class="text-xs font-mono text-sky-400 font-bold">Setor (<span id="sectorX">0</span>, <span id="sectorY">0</span>)</span>
                </div>

                <div class="flex items-center justify-between gap-2">
                    <div class="grid grid-cols-3 gap-1 w-24 h-24">
                        <div></div>
                        <button class="nav-btn" id="btnNavUp">↑</button>
                        <div></div>
                        <button class="nav-btn" id="btnNavLeft">←</button>
                        <button class="nav-btn bg-slate-800 text-slate-300 text-[10px]" id="btnNavCenter">0,0</button>
                        <button class="nav-btn" id="btnNavRight">→</button>
                        <div></div>
                        <button class="nav-btn" id="btnNavDown">↓</button>
                        <div></div>
                    </div>

                    <div class="flex flex-col items-center">
                        <span class="text-[10px] text-slate-400 mb-1">Minimapa 5x5</span>
                        <div id="minimap" class="w-20 h-20 bg-slate-950 border border-slate-800 rounded grid grid-cols-5 gap-0.5 p-1"></div>
                    </div>
                </div>
            </div>

        </aside>

        <!-- Canvas Central -->
        <section class="flex-1 flex flex-col items-center justify-start gap-4 w-full">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-2xl flex flex-col items-center gap-4 w-full">
                <div class="relative bg-slate-950 p-2 rounded-xl border border-slate-800 shadow-inner">
                    <canvas id="mapCanvas" width="576" height="576" class="cursor-crosshair rounded bg-slate-950"></canvas>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full">
                    <button id="btnClearSector" class="w-full py-2 bg-rose-900/40 hover:bg-rose-800/60 text-rose-300 border border-rose-700/50 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-trash-can"></i> Limpar Setor Atual
                    </button>
                    <button id="btnResetWorld" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate-left"></i> Resetar Todo o Mundo
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- Script Principal da Engine -->
    <script>
        const GRID_SIZE = 12;
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const CELL_SIZE = canvas.width / GRID_SIZE; // 48px

        let currentSectorX = 0;
        let currentSectorY = 0;
        let worldSectors = {}; 

        const imageCache = {};

        // Som Synthesizer
        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq = 400) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e){}
        }

        let selectedElement = { id: 'grama', type: 'terrain', w: 1, h: 1, label: 'Grama' };

        function getSectorKey(x, y) { return `${x},${y}`; }

        function getOrCreateSector(x, y) {
            const key = getSectorKey(x, y);
            if (!worldSectors[key]) {
                const matrix = Array(GRID_SIZE).fill(null).map(() => 
                    Array(GRID_SIZE).fill(null).map(() => ({ terrain: 'grama', item: null }))
                );
                worldSectors[key] = matrix;
            }
            return worldSectors[key];
        }

        // -------------------------------------------------------------
        // RENDERIZAÇÃO DO MAPA & QUADROS DE ANIMAÇÃO
        // -------------------------------------------------------------

        function renderMap() {
            const matrix = getOrCreateSector(currentSectorX, currentSectorY);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Passagem 1: Renderizar Terrenos
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const x = c * CELL_SIZE;
                    const y = r * CELL_SIZE;
                    const terrain = matrix[r][c].terrain || 'grama';

                    drawTerrainTile(terrain, x, y);

                    // Grade
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
                    ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);
                }
            }

            // Passagem 2: Renderizar Objetos, Vegetação e Construções
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const item = matrix[r][c].item;
                    if (!item) continue;

                    const x = c * CELL_SIZE;
                    const y = r * CELL_SIZE;
                    const w = (item.w || 1) * CELL_SIZE;
                    const h = (item.h || 1) * CELL_SIZE;

                    if (item.customImg) {
                        if (!imageCache[item.customImg]) {
                            const img = new Image();
                            img.src = item.customImg;
                            img.onload = () => renderMap();
                            imageCache[item.customImg] = img;
                        } else {
                            ctx.drawImage(imageCache[item.customImg], x, y, w, h);
                        }
                    } else {
                        drawObjectTile(item.id, x, y, w, h);
                    }
                }
            }

            updateMinimap();
        }

        // Game Loop para elementos animados (Água e Lava)
        function gameLoop() {
            renderMap();
            requestAnimationFrame(gameLoop);
        }

        // Desenho de Terrenos
        function drawTerrainTile(type, x, y) {
            const now = Date.now();
            
            if (type === 'grama') {
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#15803d';
                ctx.fillRect(x + 10, y + 12, 3, 6); ctx.fillRect(x + 13, y + 10, 3, 8);
                ctx.fillRect(x + 30, y + 26, 3, 8); ctx.fillRect(x + 33, y + 28, 3, 6);
            } else if (type === 'terra') {
                ctx.fillStyle = '#78350f';
                ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#451a03';
                ctx.fillRect(x + 8, y + 8, 10, 10); ctx.fillRect(x + 26, y + 26, 12, 12);
            } else if (type === 'agua') {
                ctx.fillStyle = '#0284c7'; ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                const frame = Math.floor(now / 250) % 3;
                ctx.fillStyle = '#38bdf8';
                const offX = frame * 6;
                ctx.fillRect(x + ((4 + offX) % 28), y + 12, 18, 4);
                ctx.fillRect(x + ((22 + offX) % 28), y + 30, 20, 4);
                ctx.fillStyle = '#e0f2fe';
                ctx.fillRect(x + ((18 + offX) % 28), y + 12, 4, 4);
            } else if (type === 'agua_congelada') {
                ctx.fillStyle = '#0284c7'; ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = 'rgba(224, 242, 254, 0.75)'; ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + 4, y + 8, 20, 3); ctx.fillRect(x + 12, y + 20, 18, 3);
                ctx.fillRect(x + 24, y + 34, 16, 3);
            } else if (type === 'neve') {
                ctx.fillStyle = '#f0f9ff'; ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#bae6fd';
                ctx.fillRect(x + 6, y + 10, 10, 4); ctx.fillRect(x + 28, y + 28, 12, 4);
            } else if (type === 'areia_praia') {
                ctx.fillStyle = '#fef08a'; ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#facc15';
                ctx.fillRect(x + 8, y + 14, 12, 3); ctx.fillRect(x + 26, y + 32, 14, 3);
            } else if (type === 'areia') {
                ctx.fillStyle = '#eab308'; ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#ca8a04';
                ctx.fillRect(x + 10, y + 12, 4, 4); ctx.fillRect(x + 30, y + 28, 4, 4);
            } else if (type === 'pedra') {
                ctx.fillStyle = '#475569'; ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#334155';
                ctx.fillRect(x + 2, y + 22, 44, 2); ctx.fillRect(x + 22, y + 2, 2, 20);
            } else if (type === 'taiga') {
                ctx.fillStyle = '#14532d'; ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#052e16';
                ctx.fillRect(x + 10, y + 10, 6, 6);
            } else if (type === 'rocha') {
                ctx.fillStyle = '#334155'; ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(x + 6, y + 6, 36, 36);
            } else if (type === 'manguezal') {
                ctx.fillStyle = '#3f4f24'; ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#1c260d';
                ctx.fillRect(x + 4, y + 16, 14, 6); ctx.fillRect(x + 24, y + 28, 16, 6);
                ctx.fillStyle = '#65a30d';
                ctx.fillRect(x + 12, y + 8, 4, 4); ctx.fillRect(x + 30, y + 20, 4, 4);
            } else if (type === 'lama') {
                ctx.fillStyle = '#451a03'; ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#270e02';
                ctx.fillRect(x + 6, y + 12, 18, 10); ctx.fillRect(x + 22, y + 28, 16, 12);
            } else if (type === 'lava') {
                ctx.fillStyle = '#dc2626'; ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                const lFrame = Math.floor(now / 200) % 4;
                ctx.fillStyle = '#f97316';
                ctx.fillRect(x + ((lFrame * 8) % 32), y + 8, 16, 8);
                ctx.fillRect(x + ((32 - lFrame * 8) % 32), y + 28, 16, 8);
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(x + ((lFrame * 8 + 4) % 32), y + 10, 6, 4);
            }
        }

        // Desenho de Objetos, Vegetação e Estruturas
        function drawObjectTile(id, x, y, w, h) {
            if (id === 'arvore') {
                ctx.fillStyle = '#78350f'; ctx.fillRect(x + 18, y + 48, 12, 42);
                ctx.fillStyle = '#15803d'; ctx.fillRect(x + 6, y + 6, 36, 48);
                ctx.fillStyle = '#22c55e'; ctx.fillRect(x + 10, y + 10, 12, 12);
            } else if (id === 'pinheiro') {
                ctx.fillStyle = '#78350f'; ctx.fillRect(x + 20, y + 70, 8, 22);
                ctx.fillStyle = '#14532d';
                ctx.beginPath(); ctx.moveTo(x + 4, y + 70); ctx.lineTo(x + 24, y + 30); ctx.lineTo(x + 44, y + 70); ctx.fill();
                ctx.beginPath(); ctx.moveTo(x + 8, y + 40); ctx.lineTo(x + 24, y + 6); ctx.lineTo(x + 40, y + 40); ctx.fill();
            } else if (id === 'coqueiro') {
                // Tronco Curvado
                ctx.fillStyle = '#78350f';
                ctx.fillRect(x + 16, y + 50, 10, 42);
                ctx.fillRect(x + 20, y + 24, 10, 28);
                // Folhas do Coqueiro
                ctx.fillStyle = '#16a34a';
                ctx.fillRect(x, y + 10, 22, 8); ctx.fillRect(x + 26, y + 10, 22, 8);
                ctx.fillRect(x + 10, y, 28, 12); ctx.fillRect(x + 8, y + 18, 32, 8);
                // Cocos
                ctx.fillStyle = '#451a03';
                ctx.fillRect(x + 18, y + 20, 5, 5); ctx.fillRect(x + 25, y + 20, 5, 5);
            } else if (id === 'savana') {
                ctx.fillStyle = '#eab308'; ctx.fillRect(x + 4, y + 12, 40, 78);
                ctx.fillStyle = '#d97706'; ctx.fillRect(x + 8, y + 16, 6, 70); ctx.fillRect(x + 20, y + 12, 6, 74);
            } else if (id === 'cacto') {
                const cx = x + 18;
                ctx.fillStyle = '#15803d';
                ctx.fillRect(cx, y + 10, 12, 80);
                ctx.fillRect(cx - 12, y + 36, 12, 8); ctx.fillRect(cx - 12, y + 20, 8, 24);
                ctx.fillRect(cx + 12, y + 48, 12, 8); ctx.fillRect(cx + 16, y + 28, 8, 28);
            } else if (id === 'arbusto_grama') {
                ctx.fillStyle = '#15803d'; ctx.beginPath(); ctx.arc(x + 24, y + 28, 14, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(x + 20, y + 24, 8, 0, Math.PI*2); ctx.fill();
            } else if (id === 'arbusto_neve') {
                ctx.fillStyle = '#0284c7'; ctx.beginPath(); ctx.arc(x + 24, y + 28, 14, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#f0f9ff'; ctx.beginPath(); ctx.arc(x + 24, y + 22, 10, 0, Math.PI*2); ctx.fill();
            } else if (id === 'arbusto_praia') {
                ctx.fillStyle = '#ca8a04'; ctx.fillRect(x + 12, y + 20, 24, 20);
                ctx.fillStyle = '#fef08a'; ctx.fillRect(x + 16, y + 14, 16, 8);
            } else if (id === 'arbusto_mangue') {
                ctx.fillStyle = '#1a2e05'; ctx.fillRect(x + 10, y + 18, 28, 24);
                ctx.fillStyle = '#4d7c0f'; ctx.fillRect(x + 14, y + 12, 20, 12);
            } else if (id === 'casa') {
                ctx.fillStyle = '#ef4444';
                ctx.beginPath(); ctx.moveTo(x + 4, y + 44); ctx.lineTo(x + w/2, y + 8); ctx.lineTo(x + w - 4, y + 44); ctx.fill();
                ctx.fillStyle = '#fde047'; ctx.fillRect(x + 8, y + 44, w - 16, h - 48);
                ctx.fillStyle = '#0284c7'; ctx.fillRect(x + 18, y + 56, 18, 18);
                ctx.fillStyle = '#78350f'; ctx.fillRect(x + w - 36, y + 56, 18, 32);
            } else if (id === 'casa_2andares') {
                // Telhado
                ctx.fillStyle = '#b91c1c';
                ctx.beginPath(); ctx.moveTo(x + 2, y + 36); ctx.lineTo(x + w/2, y + 4); ctx.lineTo(x + w - 2, y + 36); ctx.fill();
                // 2º Andar
                ctx.fillStyle = '#fde047'; ctx.fillRect(x + 8, y + 36, w - 16, 44);
                ctx.fillStyle = '#0284c7'; ctx.fillRect(x + 16, y + 46, 16, 16); ctx.fillRect(x + w - 32, y + 46, 16, 16);
                // Sacada/Viga
                ctx.fillStyle = '#78350f'; ctx.fillRect(x + 6, y + 80, w - 12, 6);
                // 1º Andar
                ctx.fillStyle = '#facc15'; ctx.fillRect(x + 8, y + 86, w - 16, 52);
                ctx.fillStyle = '#0284c7'; ctx.fillRect(x + 16, y + 98, 18, 20);
                ctx.fillStyle = '#451a03'; ctx.fillRect(x + w - 38, y + 96, 22, 42);
            } else if (id === 'muralha') {
                ctx.fillStyle = '#64748b'; ctx.fillRect(x, y, w, h);
                ctx.fillStyle = '#334155'; ctx.fillRect(x, y, 12, 10); ctx.fillRect(x + 24, y, 12, 10);
            } else if (id === 'torre') {
                ctx.fillStyle = '#64748b'; ctx.fillRect(x + 8, y + 20, w - 16, h - 20);
                ctx.fillStyle = '#334155'; ctx.fillRect(x + 4, y, w - 8, 20);
                ctx.fillStyle = '#0f172a'; ctx.fillRect(x + w/2 - 6, y + 40, 12, 18);
            } else if (id === 'portao') {
                ctx.fillStyle = '#475569'; ctx.fillRect(x, y, w, h);
                ctx.fillStyle = '#1e293b'; ctx.fillRect(x + 16, y + 20, w - 32, h - 20);
                ctx.fillStyle = '#78350f'; ctx.fillRect(x + 20, y + 24, w - 40, h - 24);
            } else if (id === 'vulcao') {
                // Vulcão (3x3)
                ctx.fillStyle = '#334155';
                ctx.beginPath(); ctx.moveTo(x + 10, y + h); ctx.lineTo(x + 36, y + 24); ctx.lineTo(x + w - 36, y + 24); ctx.lineTo(x + w - 10, y + h); ctx.fill();
                ctx.fillStyle = '#1e293b';
                ctx.beginPath(); ctx.moveTo(x + 24, y + h); ctx.lineTo(x + 44, y + 28); ctx.lineTo(x + w - 44, y + 28); ctx.lineTo(x + w - 24, y + h); ctx.fill();
                // Cratera de Lava Incandescente
                ctx.fillStyle = '#ef4444'; ctx.fillRect(x + 38, y + 20, w - 76, 12);
                ctx.fillStyle = '#fef08a'; ctx.fillRect(x + 48, y + 22, w - 96, 8);
            } else if (id === 'barco_pequeno') {
                ctx.fillStyle = '#78350f';
                ctx.beginPath(); ctx.ellipse(x + w/2, y + h/2, 14, 38, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fde047'; ctx.fillRect(x + w/2 - 2, y + 16, 4, 60); // Remo/Assento
            } else if (id === 'barco_medio') {
                // Casco
                ctx.fillStyle = '#451a03';
                ctx.beginPath(); ctx.ellipse(x + w/2, y + h/2, 28, 60, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#78350f'; ctx.fillRect(x + 12, y + 24, w - 24, h - 48);
                // Mastro e Vela Velho
                ctx.fillStyle = '#f8fafc'; ctx.fillRect(x + 8, y + 36, w - 16, 40);
                ctx.fillStyle = '#0284c7'; ctx.fillRect(x + w/2 - 2, y + 10, 4, 110);
            } else if (id === 'barco_grande') {
                // Galeão (3x4)
                ctx.fillStyle = '#361502';
                ctx.beginPath(); ctx.ellipse(x + w/2, y + h/2, 50, 85, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#78350f'; ctx.fillRect(x + 20, y + 30, w - 40, h - 60);
                // Velas Múltiplas
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + 16, y + 36, w - 32, 38);
                ctx.fillRect(x + 22, y + 90, w - 44, 44);
                // Mastros & Bandeira
                ctx.fillStyle = '#000000'; ctx.fillRect(x + w/2 - 3, y + 10, 6, 150);
                ctx.fillStyle = '#ef4444'; ctx.fillRect(x + w/2, y + 12, 18, 10);
            } else if (id === 'castelo') {
                ctx.fillStyle = '#475569'; ctx.fillRect(x + 16, y + 16, w - 32, h - 32);
                ctx.fillStyle = '#64748b';
                ctx.fillRect(x, y, 48, 48); ctx.fillRect(x + w - 48, y, 48, 48);
                ctx.fillRect(x, y + h - 48, 48, 48); ctx.fillRect(x + w - 48, y + h - 48, 48, 48);
                ctx.fillStyle = '#ef4444'; ctx.fillRect(x + 20, y - 8, 8, 12); ctx.fillRect(x + w - 28, y - 8, 8, 12);
                ctx.fillStyle = '#78350f'; ctx.fillRect(x + w/2 - 16, y + h - 40, 32, 40);
            } else if (id === 'arqueiro' || id === 'cavaleiro' || id === 'piqueiro' || id === 'besteiro') {
                const colors = { arqueiro: '#38bdf8', cavaleiro: '#ef4444', piqueiro: '#a855f7', besteiro: '#f97316' };
                ctx.fillStyle = colors[id] || '#38bdf8';
                ctx.beginPath(); ctx.arc(x + w/2, y + h/2, 14, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
            }
        }

        // Minimapa 5x5
        function updateMinimap() {
            const minimap = document.getElementById('minimap');
            minimap.innerHTML = '';
            
            for (let my = -2; my <= 2; my++) {
                for (let mx = -2; mx <= 2; mx++) {
                    const sx = currentSectorX + mx;
                    const sy = currentSectorY + my;
                    const key = getSectorKey(sx, sy);
                    const cellDiv = document.createElement('div');
                    
                    const isCurrent = (mx === 0 && my === 0);
                    const exists = !!worldSectors[key];

                    cellDiv.className = `w-full h-full rounded-sm ${
                        isCurrent ? 'bg-sky-500 border border-white' : exists ? 'bg-emerald-800' : 'bg-slate-900 border border-slate-800'
                    }`;
                    minimap.appendChild(cellDiv);
                }
            }
        }

        // Eventos do Mouse / Pintura
        let isMouseDown = false;
        canvas.onmousedown = (e) => { isMouseDown = true; paint(e); };
        canvas.onmousemove = (e) => { if (isMouseDown) paint(e); };
        window.onmouseup = () => { isMouseDown = false; };

        function paint(e) {
            const rect = canvas.getBoundingClientRect();
            const col = Math.floor((e.clientX - rect.left) / (rect.width / GRID_SIZE));
            const row = Math.floor((e.clientY - rect.top) / (rect.height / GRID_SIZE));

            if (col < 0 || col >= GRID_SIZE || row < 0 || row >= GRID_SIZE) return;

            const matrix = getOrCreateSector(currentSectorX, currentSectorY);

            if (selectedElement.type === 'terrain') {
                matrix[row][col].terrain = selectedElement.id;
            } else if (selectedElement.type === 'clear') {
                matrix[row][col].item = null;
            } else {
                matrix[row][col].item = {
                    id: selectedElement.id,
                    w: selectedElement.w || 1,
                    h: selectedElement.h || 1,
                    customImg: selectedElement.customImg || null
                };
            }

            playBeep(selectedElement.type === 'clear' ? 200 : 550);
        }

        // Seleção na Paleta
        document.querySelectorAll('.palette-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                selectedElement = {
                    id: btn.getAttribute('data-id'),
                    type: btn.getAttribute('data-type'),
                    w: parseInt(btn.getAttribute('data-w') || '1'),
                    h: parseInt(btn.getAttribute('data-h') || '1'),
                    label: btn.innerText
                };

                document.getElementById('activeElementLabel').innerText = btn.innerText.replace(/^[^\s]+\s/, '');
                playBeep(650);
            };
        });

        // Som Toggle
        document.getElementById('btnSoundToggle').onclick = () => {
            soundEnabled = !soundEnabled;
            document.getElementById('soundLabel').innerText = soundEnabled ? 'LIGADO' : 'DESLIGADO';
        };

        // Navegação do D-Pad
        document.getElementById('btnNavUp').onclick = () => changeSector(0, -1);
        document.getElementById('btnNavDown').onclick = () => changeSector(0, 1);
        document.getElementById('btnNavLeft').onclick = () => changeSector(-1, 0);
        document.getElementById('btnNavRight').onclick = () => changeSector(1, 0);
        document.getElementById('btnNavCenter').onclick = () => { currentSectorX = 0; currentSectorY = 0; updateSectorUI(); };

        function changeSector(dx, dy) {
            currentSectorX += dx;
            currentSectorY += dy;
            updateSectorUI();
        }

        function updateSectorUI() {
            document.getElementById('sectorX').innerText = currentSectorX;
            document.getElementById('sectorY').innerText = currentSectorY;
            playBeep(350);
        }

        // Limpeza
        document.getElementById('btnClearSector').onclick = () => {
            delete worldSectors[getSectorKey(currentSectorX, currentSectorY)];
        };

        document.getElementById('btnResetWorld').onclick = () => {
            if (confirm("Tem certeza que deseja resetar todo o mundo RPG?")) {
                worldSectors = {};
                currentSectorX = 0;
                currentSectorY = 0;
                updateSectorUI();
            }
        };

        // -------------------------------------------------------------
        // IMPORTAR ESTRUTURA DO CONSTRUCTION (JSON)
        // -------------------------------------------------------------
        const jsonInput = document.getElementById('jsonInput');
        document.getElementById('btnImportJSON').onclick = () => jsonInput.click();

        jsonInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    if (data.pixels) {
                        importStructureFromJSON(data);
                    } else {
                        alert("Arquivo JSON inválido.");
                    }
                } catch(err) {
                    alert("Erro ao ler o arquivo JSON.");
                }
            };
            reader.readAsText(file);
        };

        function importStructureFromJSON(data) {
            const size = data.gridSize || 16;
            const pixels = data.pixels;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = size;
            tempCanvas.height = size;
            const tempCtx = tempCanvas.getContext('2d');

            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    if (pixels[y][x]) {
                        tempCtx.fillStyle = pixels[y][x];
                        tempCtx.fillRect(x, y, 1, 1);
                    }
                }
            }

            const imgUrl = tempCanvas.toDataURL();
            const uniqueId = 'custom_' + Date.now();

            const container = document.getElementById('structuresContainer');
            const newBtn = document.createElement('button');
            newBtn.className = 'palette-btn col-span-2 border-amber-500/50 text-amber-300 active';
            newBtn.innerHTML = `<img src="${imgUrl}" class="w-4 h-4 rounded" style="image-rendering: pixelated;"> Custom (${size}x${size})`;

            document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('active'));

            selectedElement = {
                id: uniqueId,
                type: 'custom',
                customImg: imgUrl,
                w: 1,
                h: 1,
                label: `Custom (${size}x${size})`
            };

            newBtn.onclick = () => {
                document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('active'));
                newBtn.classList.add('active');
                selectedElement = {
                    id: uniqueId,
                    type: 'custom',
                    customImg: imgUrl,
                    w: 1,
                    h: 1,
                    label: `Custom (${size}x${size})`
                };
                document.getElementById('activeElementLabel').innerText = `Custom (${size}x${size})`;
            };

            container.appendChild(newBtn);
            document.getElementById('activeElementLabel').innerText = `Custom (${size}x${size})`;
            playBeep(800);
            alert("Estrutura importada com sucesso!");
        }

        // Salvar / Carregar / Exportar
        document.getElementById('btnSaveProject').onclick = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(worldSectors));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `mapa_rpg_mundo.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        };

        const fileLoadProject = document.getElementById('fileLoadProject');
        document.getElementById('btnLoadProject').onclick = () => fileLoadProject.click();

        fileLoadProject.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    worldSectors = JSON.parse(event.target.result);
                    alert("Projeto do mapa carregado com sucesso!");
                } catch(err) { alert("Erro ao carregar o arquivo de projeto."); }
            };
            reader.readAsText(file);
        };

        document.getElementById('btnExportPNG').onclick = () => {
            const link = document.createElement('a');
            link.download = `setor_${currentSectorX}_${currentSectorY}.png`;
            link.href = canvas.toDataURL();
            link.click();
        };

        // Inicialização e Loop Principal
        getOrCreateSector(0, 0);
        gameLoop();
    </script>
</body>
</html>
