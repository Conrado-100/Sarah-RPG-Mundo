<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction - Estúdio de Edifícios & Estruturas RPG</title>
    
    <!-- Bibliotecas de Estilo & Ícones -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="construction.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none pb-10">

    <!-- Barra de Navegação Superior -->
    <header class="bg-slate-900 border-b border-slate-800 p-3 sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-3">
            
            <div class="flex items-center space-x-3">
                <a href="../index.html" class="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs border border-slate-700 transition flex items-center gap-2">
                    <i class="fa-solid fa-house"></i> Voltar ao Menu
                </a>
                <div class="h-4 w-px bg-slate-800"></div>
                <h1 class="text-base font-bold text-amber-400 flex items-center gap-2">
                    🏗️ Construction <span class="text-xs bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded border border-amber-500/30">Edifícios & Muralhas 16-Bit</span>
                </h1>
            </div>

            <!-- Ações de Exportação e Histórico -->
            <div class="flex items-center gap-2">
                <button id="btnUndo" class="btn-secondary" title="Desfazer (Ctrl+Z)">
                    <i class="fa-solid fa-rotate-left"></i> Desfazer
                </button>
                <button id="btnRedo" class="btn-secondary" title="Refazer (Ctrl+Y)">
                    <i class="fa-solid fa-rotate-right"></i> Refazer
                </button>
                <div class="h-4 w-px bg-slate-800"></div>
                <button id="btnClear" class="btn-danger">
                    <i class="fa-solid fa-trash-can"></i> Limpar
                </button>
                <button id="btnExportPNG" class="btn-primary">
                    <i class="fa-solid fa-download"></i> Exportar PNG
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full p-4 flex-1 flex flex-col lg:flex-row gap-5 mt-2">
        
        <!-- Painel Esquerdo: Ferramentas & Materiais de Construção -->
        <aside class="w-full lg:w-80 flex flex-col gap-4">
            
            <!-- Ferramentas de Desenho -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg flex flex-col gap-3">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider border-b border-slate-800 pb-2">
                    🛠️ Ferramentas Arquitetônicas
                </h2>
                <div class="grid grid-cols-4 gap-1.5">
                    <button class="tool-btn active" data-tool="pencil" title="Lápis"><i class="fa-solid fa-pencil"></i></button>
                    <button class="tool-btn" data-tool="eraser" title="Borracha"><i class="fa-solid fa-eraser"></i></button>
                    <button class="tool-btn" data-tool="bucket" title="Balde de Tinta"><i class="fa-solid fa-fill-drip"></i></button>
                    <button class="tool-btn" data-tool="eyedropper" title="Conta-gotas"><i class="fa-solid fa-eye-dropper"></i></button>
                    <button class="tool-btn" data-tool="line" title="Linha Reta"><i class="fa-solid fa-slash"></i></button>
                    <button class="tool-btn" data-tool="rect" title="Retângulo/Bloco"><i class="fa-regular fa-square"></i></button>
                    <button class="tool-btn" data-tool="darken" title="Sombra (Escurecer)"><i class="fa-solid fa-moon"></i></button>
                    <button class="tool-btn" data-tool="lighten" title="Brilho (Clarear)"><i class="fa-solid fa-sun"></i></button>
                </div>
            </div>

            <!-- Modelos Rápidos (Presets de Estrutura) -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg flex flex-col gap-3">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider border-b border-slate-800 pb-2">
                    🏛️ Modelos de Estruturas
                </h2>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <button class="preset-btn" data-preset="stoneWall">🧱 Muro de Pedra</button>
                    <button class="preset-btn" data-preset="brickWall">🏯 Tijolos Vermelhos</button>
                    <button class="preset-btn" data-preset="woodRoof">🛖 Telhado Madeira</button>
                    <button class="preset-btn" data-preset="redRoof">🏠 Telhado Colonial</button>
                    <button class="preset-btn" data-preset="woodDoor">🚪 Porta de Madeira</button>
                    <button class="preset-btn" data-preset="archWindow">🪟 Janela Arcada</button>
                </div>
            </div>

            <!-- Materiais & Paletas de Cores de Edificação -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg flex flex-col gap-3">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">🎨 Materiais de Construção</h2>
                    <div class="flex items-center gap-1">
                        <input type="color" id="colorPicker" value="#78350f" class="w-6 h-6 rounded cursor-pointer border-0 bg-transparent">
                        <span id="hexLabel" class="text-[10px] font-mono text-slate-400">#78350f</span>
                    </div>
                </div>

                <!-- Abas de Materiais -->
                <div class="flex gap-1 border-b border-slate-800 pb-2 text-[11px]">
                    <button class="mat-tab active" data-mat="stone">Pedra/Muro</button>
                    <button class="mat-tab" data-mat="wood">Madeira</button>
                    <button class="mat-tab" data-mat="roof">Telhados</button>
                    <button class="mat-tab" data-mat="metal">Metais/Luz</button>
                </div>

                <!-- Grid de Cores da Paleta Ativa -->
                <div id="paletteGrid" class="grid grid-cols-6 gap-1.5">
                    <!-- Gerado Dinamicamente -->
                </div>
            </div>

        </aside>

        <!-- Painel Central: Canvas de Edição -->
        <section class="flex-1 flex flex-col items-center justify-start gap-4">
            
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col items-center gap-4 w-full">
                
                <!-- Barra de Opções da Grade -->
                <div class="w-full flex justify-between items-center text-xs text-slate-400 border-b border-slate-800 pb-3">
                    <div class="flex items-center gap-3">
                        <span>Resolução:</span>
                        <select id="gridSizeSelect" class="bg-slate-950 border border-slate-800 rounded px-2 py-1 text-slate-200">
                            <option value="16">16 x 16 (Tile Padrão)</option>
                            <option value="32">32 x 32 (Estrutura Dupla)</option>
                        </select>
                    </div>
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="chkGrid" checked class="rounded border-slate-700 bg-slate-950 text-amber-500 focus:ring-0">
                        Exibir Linhas da Grade
                    </label>
                </div>

                <!-- Canvas Principal -->
                <div class="relative bg-slate-950 p-2 rounded-xl border border-slate-800 shadow-inner">
                    <canvas id="mainCanvas" width="384" height="384" class="cursor-crosshair rounded bg-slate-950"></canvas>
                </div>

                <!-- Posição do Cursor -->
                <div class="text-[11px] font-mono text-slate-500 flex gap-4">
                    <span>X: <span id="posX">0</span> | Y: <span id="posY">0</span></span>
                    <span>Ferramenta: <span id="activeToolLabel" class="text-amber-400">Lápis</span></span>
                </div>

            </div>

        </section>

        <!-- Painel Direito: Testes e Visualizações de Muralha/Casa -->
        <aside class="w-full lg:w-72 flex flex-col gap-4">
            
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg flex flex-col gap-4">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider border-b border-slate-800 pb-2">
                    👁️ Testes de Conexão Real
                </h2>

                <!-- 1. Sprite Único -->
                <div class="flex flex-col items-center gap-1.5">
                    <span class="text-[10px] text-slate-400">Elemento Isolado (1x1)</span>
                    <div class="bg-slate-950 p-2 border border-slate-800 rounded">
                        <canvas id="prevSingle" width="32" height="32"></canvas>
                    </div>
                </div>

                <!-- 2. Teste de Muralha Repetida (3x3) -->
                <div class="flex flex-col items-center gap-1.5 mt-1">
                    <span class="text-[10px] text-slate-400">Conexão de Muro/Parede (3x3)</span>
                    <div class="bg-slate-950 p-2 border border-slate-800 rounded">
                        <canvas id="prevWall" width="96" height="96"></canvas>
                    </div>
                </div>

                <!-- 3. Teste em Fundo de Cenário RPG -->
                <div class="flex flex-col items-center gap-1.5 mt-1">
                    <span class="text-[10px] text-slate-400">Contexto no Terreno/Grama</span>
                    <div class="bg-[url('https://i.imgur.com/8Q8o3Zf.png')] bg-repeat p-2 border border-slate-800 rounded">
                        <canvas id="prevContext" width="96" height="96"></canvas>
                    </div>
                </div>
            </div>

        </aside>

    </main>

    <script src="construction.js"></script>
</body>
</html>
