<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Mapas RPG 2D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="map.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none">

    <header class="bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <a href="../index.html" class="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 border border-slate-700">
                <i class="fa-solid fa-house"></i> Menu
            </a>
            <h1 class="text-base font-bold text-sky-400">🗺️ Editor de Mapas RPG</h1>
        </div>

        <!-- Área de Importação de Estruturas Construction -->
        <div class="flex items-center gap-2">
            <input type="file" id="jsonInput" accept=".json" class="hidden">
            <button id="btnImportJSON" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold rounded shadow transition flex items-center gap-2">
                <i class="fa-solid fa-file-import"></i> Importar Estrutura (.JSON)
            </button>
        </div>
    </header>

    <main class="flex-1 flex gap-4 p-4">
        <!-- Paleta de Azulejos Importados -->
        <aside class="w-64 bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col gap-3">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider border-b border-slate-800 pb-2">
                🏛️ Paleta de Estruturas
            </h2>
            <div id="importedPalette" class="grid grid-cols-4 gap-2 overflow-y-auto max-h-[70vh]">
                <p class="text-[11px] text-slate-500 col-span-4 text-center py-4">Nenhuma estrutura importada ainda. Importe um arquivo .json do Construction.</p>
            </div>
        </aside>

        <!-- Canvas do Mapa -->
        <section class="flex-1 bg-slate-900 border border-slate-800 rounded-xl p-4 flex items-center justify-center">
            <canvas id="mapCanvas" width="512" height="512" class="border border-slate-800 bg-slate-950 rounded cursor-crosshair"></canvas>
        </section>
    </main>

    <script src="map.js"></script>
</body>
</html>
