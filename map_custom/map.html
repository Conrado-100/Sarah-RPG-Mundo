<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Cenários & Mapas</title>
    <link rel="stylesheet" href="map.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <a href="../index.html" class="btn-back">⬅️ Voltar ao Menu</a>
            <h1>🗺️ Criador de Cenários & Mapas</h1>
            <p>Monte seu mapa de RPG com terreno independente, estruturas e tropas transparentes.</p>
        </header>

        <!-- Barra de Ferramentas / Paleta Organizada -->
        <div class="palette-container">
            <fieldset class="palette-fieldset">
                <legend class="palette-title">🎨 Terrenos Base:</legend>
                <div class="palette-buttons">
                    <button class="tile-btn active" data-type="grass" style="--tile-color: #22c55e;">🌱 Grama</button>
                    <button class="tile-btn" data-type="dirt" style="--tile-color: #78350f;">🪵 Terra</button>
                    <button class="tile-btn" data-type="water" style="--tile-color: #0284c7;">🌊 Água</button>
                    <button class="tile-btn" data-type="stone" style="--tile-color: #64748b;">🪨 Pedra</button>
                    <button class="tile-btn" data-type="sand" style="--tile-color: #eab308;">🏜️ Areia</button>
                    <button class="tile-btn" data-type="savannah_grass" style="--tile-color: #ca8a04;">🌾 Savana</button>
                    <button class="tile-btn" data-type="ice" style="--tile-color: #bae6fd;">❄️ Gelo</button>
                    <button class="tile-btn" data-type="mountain_rock" style="--tile-color: #475569;">🏔️ Rocha</button>
                    <button class="tile-btn" data-type="taiga" style="--tile-color: #3f5e3d;">🌲 Solo Taiga</button>
                    <button class="tile-btn" data-type="erase" style="--tile-color: #0f172a;">🧹 Borracha</button>
                </div>
            </fieldset>

            <fieldset class="palette-fieldset" style="margin-top: 10px;">
                <legend class="palette-title">🌲 Vegetação (1x2):</legend>
                <div class="palette-buttons">
                    <button class="tile-btn" data-type="tree_taiga" style="--tile-color: #15803d;">🌲 Taiga (1x2)</button>
                    <button class="tile-btn" data-type="tree" style="--tile-color: #22c55e;">🌳 Comum (1x2)</button>
                    <button class="tile-btn" data-type="cactus" style="--tile-color: #16a34a;">🌵 Cacto (1x2)</button>
                    <button class="tile-btn" data-type="tree_savannah" style="--tile-color: #a16207;">🌳 Savana (1x2)</button>
                    <button class="tile-btn" data-type="tree_snow" style="--tile-color: #38bdf8;">🌲 Neve (1x2)</button>
                </div>
            </fieldset>

            <fieldset class="palette-fieldset" style="margin-top: 10px;">
                <legend class="palette-title">🏰 Estruturas & Fortificações:</legend>
                <div class="palette-buttons">
                    <button class="tile-btn" data-type="house" style="--tile-color: #ea580c;">🏠 Casa (2x2)</button>
                    <button class="tile-btn" data-type="tower_2x3" style="--tile-color: #475569;">🏰 Torre de Pedra (2x3)</button>
                    <button class="tile-btn" data-type="gatehouse" style="--tile-color: #334155;">🚪 Portão Muralha (2x2)</button>
                    <button class="tile-btn" data-type="wall_improved" style="--tile-color: #1e293b;">🧱 Muralha (1x1)</button>
                    <button class="tile-btn" data-type="castle_6x6" style="--tile-color: #dc2626;">👑 Castelo Medieval (6x6)</button>
                    <button class="tile-btn" data-type="danger" style="--tile-color: #ef4444;">💀 Perigo</button>
                </div>
            </fieldset>

            <fieldset class="palette-fieldset" style="margin-top: 10px;">
                <legend class="palette-title">⚔️ Unidades Militares (Com Fundo Transparente):</legend>
                <div class="palette-buttons">
                    <button class="tile-btn" data-type="soldier_archer" style="--tile-color: #22c55e;">🏹 Arqueiro</button>
                    <button class="tile-btn" data-type="soldier_knight" style="--tile-color: #38bdf8;">🛡️ Cavaleiro</button>
                    <button class="tile-btn" data-type="soldier_pikeman" style="--tile-color: #ca8a04;">🔱 Piqueiro</button>
                    <button class="tile-btn" data-type="soldier_crossbowman" style="--tile-color: #ef4444;">🎯 Besteiro</button>
                </div>
            </fieldset>
        </div>

        <!-- Área do Mapa (Canvas 12x24) -->
        <div class="canvas-container">
            <canvas id="mapCanvas" width="480" height="960"></canvas>
        </div>

        <!-- Ações do Mapa -->
        <div class="actions">
            <button onclick="clearMap()" class="btn-action danger">🗑️ Limpar Mapa</button>
            <button onclick="exportMap()" class="btn-action success">📸 Exportar PNG</button>
        </div>
    </div>

    <script src="map.js"></script>
</body>
</html>
