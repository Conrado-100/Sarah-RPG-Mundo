<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Cenários & Mapas</title>
    <link rel="stylesheet" href="map.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <a href="../index.html" class="btn-back">⬅️ Voltar ao Menu</a>
            <h1>🗺️ Criador de Cenários & Mapas</h1>
            <p>Selecione os terrenos, pinte o grid e monte o mapa perfeito para o seu RPG.</p>
        </header>

        <!-- Barra de Ferramentas / Paleta de Terrenos -->
        <div class="palette-container">
            <span class="palette-title">🎨 Terrenos Base:</span>
            <div class="palette-buttons">
                <button class="tile-btn active" data-type="grass" style="--tile-color: #22c55e;">🌱 Grama</button>
                <button class="tile-btn" data-type="dirt" style="--tile-color: #78350f;">🪵 Terra</button>
                <button class="tile-btn" data-type="water" style="--tile-color: #0284c7;">🌊 Água</button>
                <button class="tile-btn" data-type="stone" style="--tile-color: #64748b;">🪨 Pedra</button>
                <button class="tile-btn" data-type="wall" style="--tile-color: #334155;">🧱 Parede</button>
                <button class="tile-btn" data-type="sand" style="--tile-color: #eab308;">🏜️ Areia (Deserto)</button>
                <button class="tile-btn" data-type="savannah_grass" style="--tile-color: #ca8a04;">🌾 Savana</button>
                <button class="tile-btn" data-type="ice" style="--tile-color: #bae6fd;">❄️ Gelo / Neve</button>
                <button class="tile-btn" data-type="mountain_rock" style="--tile-color: #475569;">🏔️ Rocha Montanha</button>
                <button class="tile-btn" data-type="taiga" style="--tile-color: #3f5e3d;">🌲 Solo Taiga</button>
            </div>

            <span class="palette-title" style="margin-top: 10px;">🌲 Vegetação (1x2) & Objetos:</span>
            <div class="palette-buttons">
                <button class="tile-btn" data-type="tree_taiga" style="--tile-color: #15803d;">🌲 Pinheiro Taiga (1x2)</button>
                <button class="tile-btn" data-type="tree" style="--tile-color: #22c55e;">🌳 Árvore Comum (1x2)</button>
                <button class="tile-btn" data-type="cactus" style="--tile-color: #16a34a;">🌵 Cacto (1x2)</button>
                <button class="tile-btn" data-type="tree_savannah" style="--tile-color: #a16207;">🌳 Acácia Savana (1x2)</button>
                <button class="tile-btn" data-type="tree_snow" style="--tile-color: #38bdf8;">🌲 Pinheiro Neve (1x2)</button>
                <button class="tile-btn" data-type="house" style="--tile-color: #ea580c;">🏠 Casa (2x2)</button>
                <button class="tile-btn" data-type="danger" style="--tile-color: #ef4444;">💀 Perigo / Chefe</button>
                <button class="tile-btn" data-type="erase" style="--tile-color: #0f172a;">🧹 Borracha</button>
            </div>
        </div>

        <!-- Área do Mapa (Canvas 12x24) -->
        <div class="canvas-container">
            <canvas id="mapCanvas" width="480" height="960"></canvas>
        </div>

        <!-- Ações do Mapa -->
        <div class="actions">
            <button onclick="clearMap()" class="btn-action danger">🗑️ Limpar Mapa</button>
            <button onclick="exportMap()" class="btn-action success">📸 Exportar PNG</button>
        </div>
    </div>

    <script src="map.js"></script>
</body>
</html>
