<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Mapas RPG 2D - 16-Bit Retro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="map.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none p-4">

    <!-- Cabeçalho Principal -->
    <header class="w-full max-w-7xl mx-auto bg-slate-900 border border-slate-800 rounded-xl p-3 mb-4 shadow-lg flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <a href="../index.html" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs border border-slate-700 transition" title="Voltar ao Menu">
                <i class="fa-solid fa-map"></i>
            </a>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-base font-black text-slate-100 tracking-wide">Criador de Mapas RPG 2D</h1>
                    <span class="text-[10px] bg-emerald-500/20 text-emerald-400 font-mono font-bold px-2 py-0.5 rounded border border-emerald-500/30">16-Bit Retro</span>
                </div>
                <p class="text-[11px] text-slate-400">Edição Ortopédica 2D - Grade 12x12 com Setores Infinitos</p>
            </div>
        </div>

        <!-- Botões do Header -->
        <div class="flex items-center gap-2 text-xs">
            <button id="btnSoundToggle" class="px-3 py-1.5 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-lg hover:bg-amber-500/20 font-medium transition flex items-center gap-1.5">
                <i class="fa-solid fa-volume-high"></i> Som: <span id="soundLabel">LIGADO</span>
            </button>
            
            <button id="btnSaveProject" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium shadow transition flex items-center gap-1.5">
                <i class="fa-solid fa-download"></i> Salvar Projeto
            </button>

            <button id="btnLoadProject" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium shadow transition flex items-center gap-1.5">
                <i class="fa-solid fa-upload"></i> Carregar
            </button>
            <input type="file" id="fileLoadProject" accept=".json" class="hidden">

            <!-- Botão Importar JSON -->
            <button id="btnImportJSON" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white rounded-lg font-medium shadow transition flex items-center gap-1.5">
                <i class="fa-solid fa-file-import"></i> Importar JSON
            </button>
            <input type="file" id="jsonInput" accept=".json" class="hidden">

            <button id="btnExportPNG" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-medium shadow transition flex items-center gap-1.5">
                <i class="fa-solid fa-image"></i> Exportar PNG
            </button>
        </div>
    </header>

    <!-- Área Principal -->
    <main class="w-full max-w-7xl mx-auto flex-1 flex flex-col lg:flex-row gap-4 items-start">
        
        <!-- Sidebar Esquerda -->
        <aside class="w-full lg:w-80 flex flex-col gap-4">
            
            <!-- Paleta de Elementos -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg flex flex-col gap-3">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                    <h2 class="text-xs font-bold text-slate-100 flex items-center gap-2">
                        🎨 Paleta de Elementos
                    </h2>
                    <span id="activeElementLabel" class="text-xs font-semibold text-emerald-400">Grama</span>
                </div>

                <div class="flex flex-col gap-3 overflow-y-auto max-h-[480px] pr-1">
                    
                    <!-- Terrenos Básicos (1x1) -->
                    <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">🌱 Terrenos Básicos (1x1)</span>
                        <div class="grid grid-cols-2 gap-1.5">
                            <button class="palette-btn active" data-id="grama" data-type="terrain">🟢 Grama</button>
                            <button class="palette-btn" data-id="terra" data-type="terrain">🟤 Terra</button>
                            <button class="palette-btn" data-id="agua" data-type="terrain">🔵 Água</button>
                            <button class="palette-btn" data-id="pedra" data-type="terrain">⚪ Pedra</button>
                            <button class="palette-btn" data-id="areia" data-type="terrain">🟡 Areia</button>
                            <button class="palette-btn" data-id="gelo" data-type="terrain">🧊 Gelo</button>
                            <button class="palette-btn" data-id="taiga" data-type="terrain">🌲 Taiga</button>
                            <button class="palette-btn" data-id="rocha" data-type="terrain">⚫ Rocha</button>
                        </div>
                        <button class="palette-btn border-rose-500/30 text-rose-400 hover:bg-rose-500/10 mt-1.5 justify-center" data-id="clear" data-type="clear">
                            🧹 Limpar Célula
                        </button>
                    </div>

                    <!-- Vegetação & Natureza (1x2) -->
                    <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">🌲 Vegetação & Natureza (1x2)</span>
                        <div class="grid grid-cols-2 gap-1.5">
                            <button class="palette-btn" data-id="arvore" data-type="object" data-w="1" data-h="2">🌲 Árvore (1x2)</button>
                            <button class="palette-btn" data-id="pinheiro" data-type="object" data-w="1" data-h="2">🌲 Pinheiro (1x2)</button>
                            <button class="palette-btn" data-id="savana" data-type="object" data-w="1" data-h="2">🌾 Savana (1x2)</button>
                            <button class="palette-btn" data-id="cacto" data-type="object" data-w="1" data-h="2">🌵 Cacto (1x2)</button>
                        </div>
                    </div>

                    <!-- Estruturas & Edifícios -->
                    <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">🏰 Estruturas & Edifícios</span>
                        <div id="structuresContainer" class="grid grid-cols-2 gap-1.5">
                            <button class="palette-btn" data-id="casa" data-type="object" data-w="2" data-h="2">🏠 Casa (2x2)</button>
                            <button class="palette-btn" data-id="torre" data-type="object" data-w="2" data-h="3">🏰 Torre (2x3)</button>
                            <button class="palette-btn" data-id="portao" data-type="object" data-w="2" data-h="2">🚪 Portão (2x2)</button>
                            <button class="palette-btn" data-id="muralha" data-type="object" data-w="1" data-h="1">🧱 Muralha (1x1)</button>
                            <button class="palette-btn col-span-2 border-amber-500/40 text-amber-300" data-id="castelo" data-type="object" data-w="4" data-h="4">
                                🏰 Castelo Imponente (4x4)
                            </button>
                        </div>
                    </div>

                    <!-- Unidades Militares (1x1) -->
                    <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">⚔️ Unidades Militares (1x1)</span>
                        <div class="grid grid-cols-2 gap-1.5">
                            <button class="palette-btn" data-id="arqueiro" data-type="unit">🏹 Arqueiro</button>
                            <button class="palette-btn" data-id="cavaleiro" data-type="unit">🛡️ Cavaleiro</button>
                            <button class="palette-btn" data-id="piqueiro" data-type="unit">🗡️ Piqueiro</button>
                            <button class="palette-btn" data-id="besteiro" data-type="unit">🎯 Besteiro</button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Navegação do Mundo -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg flex flex-col gap-3">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                    <h2 class="text-xs font-bold text-slate-100 flex items-center gap-1.5">🧭 Navegação do Mundo</h2>
                    <span class="text-xs font-mono text-sky-400 font-bold">Setor (<span id="sectorX">0</span>, <span id="sectorY">0</span>)</span>
                </div>

                <div class="flex items-center justify-between gap-2">
                    <div class="grid grid-cols-3 gap-1 w-24 h-24">
                        <div></div>
                        <button class="nav-btn" id="btnNavUp">↑</button>
                        <div></div>
                        <button class="nav-btn" id="btnNavLeft">←</button>
                        <button class="nav-btn bg-slate-800 text-slate-300 text-[10px]" id="btnNavCenter">0,0</button>
                        <button class="nav-btn" id="btnNavRight">→</button>
                        <div></div>
                        <button class="nav-btn" id="btnNavDown">↓</button>
                        <div></div>
                    </div>

                    <div class="flex flex-col items-center">
                        <span class="text-[10px] text-slate-400 mb-1">Minimapa 5x5</span>
                        <div id="minimap" class="w-20 h-20 bg-slate-950 border border-slate-800 rounded grid grid-cols-5 gap-0.5 p-1"></div>
                    </div>
                </div>
            </div>

        </aside>

        <!-- Canvas Central -->
        <section class="flex-1 flex flex-col items-center justify-start gap-4 w-full">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-2xl flex flex-col items-center gap-4 w-full">
                <div class="relative bg-slate-950 p-2 rounded-xl border border-slate-800 shadow-inner">
                    <canvas id="mapCanvas" width="576" height="576" class="cursor-crosshair rounded bg-slate-950"></canvas>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full">
                    <button id="btnClearSector" class="w-full py-2 bg-rose-900/40 hover:bg-rose-800/60 text-rose-300 border border-rose-700/50 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-trash-can"></i> Limpar Setor Atual
                    </button>
                    <button id="btnResetWorld" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate-left"></i> Resetar Todo o Mundo
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script src="map.js"></script>
</body>
</html>
